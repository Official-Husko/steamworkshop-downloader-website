worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/xml application/javascript
        application/json image/svg+xml font/woff2;

    server_tokens off;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Backend API, reverse-proxied so the browser only ever talks to
        # this one origin. `backend` resolves via the compose network.
        location /api/ {
            proxy_pass http://backend:8080/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # Long-lived caching for hashed static assets.
        location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
            try_files $uri =404;
            expires 30d;
            add_header Cache-Control "public, immutable" always;
        }

        # SPA fallback: unknown paths resolve client-side via the router.
        location / {
            try_files $uri /index.html;
            add_header Cache-Control "no-cache" always;
        }
    }
}
