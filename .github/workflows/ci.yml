name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum
      - run: go build ./...
      - run: go vet ./...

  docker-build:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4.2.0

      - name: Build nginx image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: false
          tags: steamworkshop-downloader-nginx:ci

      - name: Build backend image
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./backend
          push: false
          tags: steamworkshop-downloader-backend:ci
