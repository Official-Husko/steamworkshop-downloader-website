name: steamworkshop-downloader

services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
    image: steamworkshop-downloader-nginx:${VERSION:-dev}
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    image: steamworkshop-downloader-backend:${VERSION:-dev}
    environment:
      PORT: 8080
      ADMIN_PORT: 8090
      REDIS_ADDR: redis:6379
      CACHE_DIR: /data
      # Only the daily game-catalog refresh needs this (IStoreService is
      # keyed) -- item/collection resolution itself is key-free and keeps
      # working without it, just with appids instead of game names.
      STEAM_API_KEY: ${STEAM_API_KEY:-}
    volumes:
      - backend-cache:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  redis-data:
  backend-cache:
